; San9Companion 逐功能开关
;
; 与 San9Companion.exe 同目录。启动时读取一次，运行期不再写回。
; 值只能是 0 或 1：
;   1 = 开启该功能（默认）
;   0 = 关闭该功能（完全不注入相关代码）
; 其它任何值都按 0 处理 —— 手误不应该打开一个功能。
;
; 空文件 / 缺少某个键 = 该功能保持默认（开启）。
; 想测某一个功能时，把其它功能全部改成 0，只留那一个为 1。

[Features]

; 武将阵亡时能力值渐变到指定值
DeathGradient=1

; 武将成长倍率
GrowthBoost=1

; 小兵培养：强制提拔（写 0x40CAEF / 0x40BF25）
CultivateTrainNum=1

; 小兵培养：基础能力系数反转
CultivateBasicAbility=1

; 培养时长（尚未实现，只记录不生效）
CultivateDuration=1

; 熟练度上限（1000 -> 自定义）
ProficiencyCap=1

; 武将名后的 ☆/◎/○ 指示图标
ProficiencyMark=1

; 把握概率（兵法发动判定必定成功，hook 0x4FEC59）
ActivationBoost=1

; 威力一定加倍 / 会心（hook 0x50603B）
CriticalHit=1

; 兵法发动间隔（按天，per-skill，hook 0x4FF08B）
Interval=1

; 玩家蛮族阵型（把 12/13/14 号异族阵型的属性改成普通阵型属性）
BarbarianFormation=1

; 电脑作业时机
ComputerWorkTiming=1

; 跳过耐久攻城选择
SkipSiegeSelection=1
